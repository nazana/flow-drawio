name: Windows Electron portable
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run electron:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test the portable EXE on Windows
        run: node scripts/smoke-electron.mjs
      - name: Create checksum
        shell: pwsh
        run: |
          $file = Get-Item releases/Flow-Studio-*-Windows-x64-Portable.exe
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content releases/SHA256SUMS-electron.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-electron-portable
          path: |
            releases/Flow-Studio-*-Windows-x64-Portable.exe
            releases/SHA256SUMS-electron.txt
            releases/windows-electron-smoke.png
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = Get-Item releases/Flow-Studio-*-Windows-x64-Portable.exe
          gh release create $env:GITHUB_REF_NAME --verify-tag --title "Flow Studio $env:GITHUB_REF_NAME — Windows Electron Portable" --notes-file docs/electron-release.md $file.FullName releases/SHA256SUMS-electron.txt
